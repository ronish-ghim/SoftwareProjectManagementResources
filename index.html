<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSC415 — Software Project Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-hover: #eef0f2;
      --surface-active: #e2e4e8;
      --text: #1a1a2e;
      --text-secondary: #4a4a5a;
      --text-muted: #8a8a9a;
      --border: #d8dade;
      --accent: #1a1a2e;
      --accent-text: #fff;
      --shadow: 0 1px 4px rgba(0,0,0,0.06);
      --shadow-lg: 0 4px 20px rgba(0,0,0,0.08);
      --radius: 8px;
      --sidebar-w: 260px;
      --topbar-h: 52px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      --toc-w: 220px;
    }
    .dark {
      --bg: #111118;
      --surface: #1a1a24;
      --surface-hover: #252530;
      --surface-active: #2e2e3c;
      --text: #e4e4ed;
      --text-secondary: #9999aa;
      --text-muted: #666677;
      --border: #2a2a36;
      --accent: #6c6cff;
      --accent-text: #fff;
      --shadow: 0 1px 4px rgba(0,0,0,0.3);
      --shadow-lg: 0 4px 20px rgba(0,0,0,0.4);
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      font-size: 15px;
      transition: background 0.2s, color 0.2s;
    }
    ::selection { background: var(--accent); color: var(--accent-text); }

    #progress {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      background: var(--accent);
      z-index: 999;
      width: 0%;
      transition: width 0.05s linear;
    }

    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1rem;
      z-index: 100;
      gap: 0.5rem;
      transition: background 0.2s, border-color 0.2s;
    }
    .topbar button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      padding: 0.3rem 0.5rem;
      border-radius: 6px;
      font-size: 1.1rem;
      transition: background 0.12s;
    }
    .topbar button:hover { background: var(--surface-hover); }
    .topbar .brand {
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .topbar .brand span { color: var(--text-muted); font-weight: 400; }
    .topbar .doc-title {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-left: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 35vw;
    }
    .topbar .divider { width: 1px; height: 20px; background: var(--border); margin: 0 0.3rem; }
    .topbar #themeToggle { font-size: 0.95rem; }

    .sidebar-overlay { display: none; }
    .sidebar {
      position: fixed;
      top: var(--topbar-h); left: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      z-index: 90;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, border-color 0.2s, transform 0.2s ease;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sidebar-search {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-search input {
      width: 100%;
      padding: 0.45rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.78rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .sidebar-search input:focus { border-color: var(--accent); }
    .sidebar-search input::placeholder { color: var(--text-muted); }
    .sidebar-search .search-wrap { position: relative; display: flex; align-items: center; }
    .sidebar-search .search-icon {
      position: absolute; left: 0.6rem; font-size: 0.75rem;
      color: var(--text-muted); pointer-events: none; line-height: 1;
    }
    .sidebar-search input { padding-left: 1.8rem; padding-right: 1.8rem; }
    .sidebar-search .search-clear {
      position: absolute; right: 0.3rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 1.05rem; padding: 0.1rem 0.35rem;
      display: none; line-height: 1; border-radius: 3px;
      transition: color 0.1s, background 0.1s;
    }
    .sidebar-search .search-clear:hover { background: var(--surface-hover); color: var(--text); }
    .sidebar-search .search-clear.visible { display: flex; align-items: center; justify-content: center; }

    .search-results { display: none; }
    .search-results.open { display: block; }
    .search-results .result-header {
      padding: 0.6rem 0.8rem 0.4rem;
      font-size: 0.65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .search-results .result-item {
      display: block;
      padding: 0.5rem 0.8rem;
      text-decoration: none;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.1s;
    }
    .search-results .result-item:hover { background: var(--surface-hover); }
    .search-results .result-item .result-title {
      font-size: 0.78rem; font-weight: 600; color: var(--text);
      display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.25rem;
    }
    .search-results .result-item .result-title .badge {
      flex-shrink: 0;
      width: 1.2rem; height: 1.2rem;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 3px; font-weight: 700; font-size: 0.55rem;
      background: var(--accent); color: var(--accent-text);
    }
    .search-results .result-item .result-title .badge.supp { background: #2d6a4f; color: #fff; }
    .search-results .result-item .snippet {
      font-size: 0.7rem; color: var(--text-secondary);
      line-height: 1.5; font-family: var(--mono);
      white-space: pre-wrap; word-break: break-word;
      background: var(--bg); padding: 0.3rem 0.5rem;
      border-radius: 4px; margin-left: 1.6rem;
      overflow-x: auto;
    }
    .search-results .result-item .snippet mark {
      background: #fde68a; color: #1a1a2e;
      padding: 0 0.12rem; border-radius: 2px;
    }
    .dark .search-results .result-item .snippet mark {
      background: #a37d1c; color: #fff;
    }
    .search-results .result-item .result-meta {
      font-size: 0.65rem; color: var(--text-muted);
      margin-top: 0.1rem; margin-left: 1.6rem;
    }
    .search-results .no-results, .search-results .search-loading {
      padding: 1.5rem 0.8rem; text-align: center;
      color: var(--text-muted); font-size: 0.78rem;
    }
    .search-results .search-loading .ring {
      width: 20px !important; height: 20px !important;
      border-width: 2px !important;
      margin: 0 auto 0.5rem;
    }
    .sidebar-scroll > .sidebar-group.hidden,
    .sidebar-scroll > [id^="group-"].hidden,
    .sidebar-scroll > .no-match.hidden { display: none; }

    .sidebar-scroll { flex: 1; overflow-y: auto; padding-bottom: 1rem; }
    .sidebar-group {
      padding: 0.7rem 1rem 0.3rem;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .sidebar a {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 1rem;
      text-decoration: none;
      color: var(--text);
      font-size: 0.8rem;
      border-left: 3px solid transparent;
      transition: background 0.1s;
    }
    .sidebar a:hover { background: var(--surface-hover); }
    .sidebar a.active {
      background: var(--surface-active);
      border-left-color: var(--accent);
      font-weight: 600;
    }
    .sidebar a.hidden { display: none; }
    .sidebar a .badge {
      flex-shrink: 0;
      width: 1.4rem;
      height: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.6rem;
      background: var(--accent);
      color: var(--accent-text);
      transition: background 0.2s, color 0.2s;
    }
    .sidebar a .badge.supp { background: #2d6a4f; color: #fff; }
    .sidebar .no-match {
      padding: 1rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      display: none;
    }

    .toc-panel {
      position: fixed;
      top: var(--topbar-h);
      right: 0;
      width: var(--toc-w);
      height: calc(100vh - var(--topbar-h));
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 5;
      padding: 1rem 0;
      overflow-y: auto;
    }
    .toc-panel::-webkit-scrollbar { width: 3px; }
    .toc-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .toc-panel .toc-title {
      padding: 0.4rem 1rem 0.3rem;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 700;
    }
    .toc-panel a {
      display: block;
      padding: 0.3rem 1rem;
      font-size: 0.76rem;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.1s;
      line-height: 1.4;
      border-left: 2px solid transparent;
    }
    .toc-panel a:hover { color: var(--text); background: var(--surface-hover); }
    .toc-panel a.h2 { padding-left: 1rem; }
    .toc-panel a.h3 { padding-left: 2rem; font-size: 0.72rem; }
    .toc-panel a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

    .main {
      margin: var(--topbar-h) var(--toc-w) 0 var(--sidebar-w);
      min-height: calc(100vh - var(--topbar-h));
      padding: 2rem 3rem;
      max-width: 900px;
      transition: margin 0.2s, padding 0.2s;
    }
    @media (max-width: 1200px) { .main { padding: 1.8rem 2rem; } }

    .welcome { max-width: 680px; margin: 1.5rem auto; }
    .welcome h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.2rem;
      line-height: 1.2;
    }
    .welcome .sub {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }
    .welcome .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-bottom: 2rem;
    }
    .welcome .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.15s;
    }
    .welcome .card h3 {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }
    .welcome .card p { font-size: 0.88rem; color: var(--text); }
    .welcome .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin: 1.2rem 0 0.5rem;
    }
    .welcome .unit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .welcome .unit-grid a {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.8rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 500;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.2s;
    }
    .welcome .unit-grid a:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }
    .welcome .unit-grid a .num {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.4rem;
      height: 1.4rem;
      border-radius: 4px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 0.6rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .welcome .unit-grid a .num.supp { background: #2d6a4f; color: #fff; }
    .welcome .unit-grid a .arrow { margin-left: auto; color: var(--text-muted); font-size: 0.75rem; }
    @media (max-width: 600px) {
      .welcome .grid { grid-template-columns: 1fr; }
      .welcome .unit-grid { grid-template-columns: 1fr; }
    }

    .markdown-body {
      background: transparent;
      font-size: 0.95rem;
      color: var(--text);
      transition: color 0.2s;
    }
    .markdown-body h1, .markdown-body h2 { border-bottom-color: var(--border); }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      color: var(--text);
      scroll-margin-top: calc(var(--topbar-h) + 0.5rem);
    }
    .markdown-body a { color: var(--accent); }
    .markdown-body strong { color: var(--accent); font-weight: 700; }
    .markdown-body em { color: var(--text-secondary); font-style: italic; }
    .markdown-body strong em, .markdown-body em strong { color: var(--accent); font-style: italic; font-weight: 700; }
    .markdown-body pre {
      background: var(--bg) !important;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      position: relative;
      transition: background 0.2s, border-color 0.2s;
      line-height: 1.2;
      white-space: pre;
      overflow-x: auto;
    }
    .markdown-body code {
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.82em;
    }
    .markdown-body pre code { font-size: 0.8rem; }
    .markdown-body blockquote {
      color: var(--text-secondary);
      border-left-color: var(--border);
    }
    .markdown-body p > code, .markdown-body li > code {
      background: var(--surface-hover);
      padding: 0.1em 0.3em;
      border-radius: 3px;
      font-size: 0.85em;
    }
    .markdown-body table td, .markdown-body table th { border-color: var(--border); }
    .markdown-body table tr { background: transparent; }
    .markdown-body table tr:nth-child(2n) { background: var(--bg); }
    .markdown-body img { border-radius: var(--radius); max-width: 100%; }
    .markdown-body .math, .markdown-body .katex-display { overflow-x: auto; overflow-y: hidden; }
    .markdown-body .katex { font-size: 1.05em; }
    .markdown-body p { margin-bottom: 1em; }
    .markdown-body hr { background: var(--border); }
    .markdown-body pre {
      padding-top: 2.2rem !important;
    }
    .copy-btn {
      position: absolute;
      top: 0.4rem;
      right: 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      font-size: 0.68rem;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font);
      opacity: 0;
      transition: opacity 0.15s, background 0.12s;
    }
    .markdown-body pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--surface-hover); color: var(--text); }
    .copy-btn.copied { background: #2d6a4f; color: #fff; border-color: #2d6a4f; }

    .doc-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      transition: border-color 0.2s;
    }
    .doc-bar .sep { color: var(--text-muted); }
    .doc-bar .current { font-weight: 600; color: var(--text); }
    .doc-bar .back-home {
      color: var(--text-secondary);
      text-decoration: none;
      margin-left: auto;
      font-size: 0.78rem;
    }
    .doc-bar .back-home:hover { text-decoration: underline; }

    .spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 0;
      gap: 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .spinner .ring {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      text-align: center;
      padding: 4rem 2rem;
      color: #b91c1c;
    }
    .error h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    .error a { color: var(--accent); }

    .fade-in {
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 820px) {
      .sidebar {
        transform: translateX(-100%);
        top: 0;
        padding-top: var(--topbar-h);
        box-shadow: var(--shadow-lg);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.3);
        z-index: 89;
      }
      .sidebar-overlay.show { display: block; }
      .toc-panel { display: none; }
      .main { margin-left: 0; margin-right: 0; padding: 1.2rem 1rem; }
      .topbar .doc-title { max-width: 25vw; }
      .copy-btn { opacity: 1 !important; }
    }
  </style>
</head>
<body>

  <div id="progress"></div>

  <div class="sidebar-overlay" id="overlay"></div>

  <header class="topbar">
    <button id="menuBtn" onclick="toggleSidebar()" aria-label="Toggle sidebar">&#9776;</button>
    <div class="brand">CSC415 <span>SPM</span></div>
    <div class="divider"></div>
    <span class="doc-title" id="docTitle"></span>
    <div class="divider"></div>
    <button id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">&#9681;</button>
  </header>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-search">
      <div class="search-wrap">
        <span class="search-icon">&#x1F50D;</span>
        <input type="text" id="searchInput" placeholder="Search notes&hellip;" oninput="onSearchInput(this.value)" spellcheck="false">
        <button class="search-clear" id="searchClear" onclick="clearSearch()" aria-label="Clear search">&times;</button>
      </div>
    </div>
    <div class="sidebar-scroll">
      <div class="sidebar-group">Project Foundation</div>
      <div id="group-1"></div>
      <div class="sidebar-group">Planning &amp; Scheduling</div>
      <div id="group-2"></div>
      <div class="sidebar-group">Execution &amp; Control</div>
      <div id="group-3"></div>
      <div class="sidebar-group">Quality &amp; Configuration</div>
      <div id="group-4"></div>
      <div class="sidebar-group" style="margin-top:0.5rem">Reference</div>
      <div id="group-supp"></div>
      <div class="sidebar-group" style="font-size:0.55rem;color:var(--text-muted);padding:0.3rem 1rem 0.15rem;letter-spacing:0.06em">Interactive Tools</div>
      <a href="#ztable" data-file="ztable" style="font-size:0.8rem"><span class="badge" style="background:#6b21a8">Z</span> Z-Table (Interactive)</a>
      <a href="#interest" data-file="interest" style="font-size:0.8rem"><span class="badge" style="background:#6b21a8">I</span> Interest Factors</a>
      <div class="no-match" id="noMatch">No notes match your filter.</div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </nav>

  <div class="toc-panel" id="tocPanel">
    <div class="toc-title">On this page</div>
    <div id="tocLinks"></div>
  </div>

  <main class="main" id="main"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script>
    const notes = [
      { file: 'unit_01_introduction_to_software_project_management.md', label: 'Introduction to SPM',                 num: '01', g: 1 },
      { file: 'unit_02_project_analysis.md',                           label: 'Project Analysis',                     num: '02', g: 1 },
      { file: 'unit_03_activity_planning_and_scheduling.md',           label: 'Activity Planning & Scheduling',      num: '03', g: 2 },
      { file: 'unit_04_risk_management.md',                            label: 'Risk Management',                     num: '04', g: 2 },
      { file: 'unit_05_resource_allocation.md',                        label: 'Resource Allocation',                 num: '05', g: 2 },
      { file: 'unit_06_monitoring_and_control.md',                     label: 'Monitoring & Control',                num: '06', g: 3 },
      { file: 'unit_07_managing_contracts_and_people.md',              label: 'Managing Contracts & People',         num: '07', g: 3 },

    const contentCache = {};

    async function fetchContent(file) {
      if (contentCache[file]) return contentCache[file];
      try {
        const isSupp = supplements.some(s => s.file === file);
        const path = isSupp ? file : basePath + file;
        const res = await fetch(path);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        contentCache[file] = text;
        return text;
      } catch {
        return null;
      }
    }

    function debounce(fn, ms) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), ms);
      };
    }

    function highlightMatch(text, query) {
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');

    async function searchContent(query) {
      const q = query.toLowerCase().trim();
      if (!q || q.length < 2) return;

      const resultsContainer = document.getElementById('searchResults');
      showSearchResults();
      resultsContainer.innerHTML = '<div class="search-loading"><div class="ring"></div><span>Searching notes...</span></div>';

      const results = [];

      for (const note of allFiles) {
        const content = await fetchContent(note.file);
        if (!content) continue;

        const lines = content.split('\n');
        const lower = content.toLowerCase();
        let pos = lower.indexOf(q);
        let matchCount = 0;

        while (pos !== -1 && matchCount < 3) {
          const lineBefore = content.substring(0, pos);
          const lineNum = lineBefore.split('\n').length;
          const lineIdx = lineNum - 1;
          const matchedLine = lines[lineIdx] || '';

          const startLine = Math.max(0, lineIdx - 1);
          const endLine = Math.min(lines.length, lineIdx + 2);
          let snippet = lines.slice(startLine, endLine).join('\n');
          snippet = highlightMatch(snippet, query);

          results.push({ note, lineNum, snippet });

          matchCount++;
          pos = lower.indexOf(q, pos + 1);
        }

        if (pos !== -1) {
          let extraCount = 0;
          while (pos !== -1) { extraCount++; pos = lower.indexOf(q, pos + 1); }
          if (extraCount > 0) {
            const last = results[results.length - 1];
            if (last && last.note.file === note.file) {
              last.extra = extraCount;
            }
          }
        }
      }

      renderSearchResults(query, results);
    }

    function renderSearchResults(query, results) {
      const container = document.getElementById('searchResults');
      if (!results.length) {
        container.innerHTML = `<div class="no-results">No results found for &ldquo;${query}&rdquo;</div>`;
        return;

      const total = results.reduce((sum, r) => sum + 1 + (r.extra || 0), 0);
      let html = `<div class="result-header">${total} result${total !== 1 ? 's' : ''} for &ldquo;${query}&rdquo;</div>`;

      results.forEach(r => {
        const isSupp = r.note.g === 'supp';
        const badge = isSupp ? r.note.label[0] : r.note.num;
        const badgeClass = isSupp ? 'badge supp' : 'badge';
        const extra = r.extra ? `<div class="result-meta">+${r.extra} more match${r.extra > 1 ? 'es' : ''}</div>` : '';

        html += `
          <a class="result-item" href="#${r.note.file}|${r.lineNum}" onclick="clearSearch()">
            <div class="result-title"><span class="${badgeClass}">${badge}</span> ${r.note.label}</div>
            <div class="snippet">${r.snippet}</div>
            ${extra}
          </a>
        `;
      });

      container.innerHTML = html;
    }

    async function loadFile(file, scrollToLine) {
      const main = document.getElementById('main');
      const entry = allFiles.find(f => f.file === file);
      const label = entry?.label || file;
      document.getElementById('docTitle').textContent = label;
      document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
      const activeLink = document.querySelector(`.sidebar a[data-file="${file}"]`);
      if (activeLink) activeLink.classList.add('active');
      if (window.innerWidth <= 820) closeSidebar();

      // Clean up any stale ref-tool artifacts
      document.getElementById('ttip')?.remove();

      const refEntry = refTools.find(f => f.file === file);
      if (refEntry) {
        document.querySelectorAll('#tocLinks a').forEach(a => a.classList.remove('active'));
        if (file === 'ztable') renderZTable(main);
        else if (file === 'interest') renderInterestFactors(main);
        window.scrollTo(0, 0);
        return;
      }

      main.innerHTML = '<div class="spinner"><div class="ring"></div><span>Loading&hellip;</span></div>';
      document.querySelectorAll('#tocLinks a').forEach(a => a.classList.remove('active'));

      try {
        const md = await fetchContent(file);
        if (!md) throw new Error('Not found');
        const mathPlaceholders = [];
        const protectedMd = md
          .replace(/\$\$[\s\S]*?\$\$/g, function(m) {
            const idx = mathPlaceholders.length;
            mathPlaceholders.push(m);
            return `\uFFFCMATH${idx}\uFFFC`;
          })
          .replace(/\$[^$\n]*?[\\^_{}[\]][^$\n]*?\$/g, function(m) {
            const idx = mathPlaceholders.length;
            mathPlaceholders.push(m);
            return `\uFFFCMATH${idx}\uFFFC`;
          })
          .replace(/\$(\d)/g, function(_, d) {
            const idx = mathPlaceholders.length;
            mathPlaceholders.push('$');
            return `\uFFFCCUR${idx}\uFFFC${d}`;
          });
        const html = marked.parse(protectedMd).replace(/src="assets\//g, 'src="notes/assets/')
          .replace(/\uFFFCMATH(\d+)\uFFFC/g, function(_, idx) { return mathPlaceholders[+idx]; });
        main.innerHTML = `
          <div class="doc-bar fade-in">
            <a href="#" class="back-home">&larr; Home</a>
            <span class="sep">/</span>
            <span class="current">${label}</span>
          </div>
          <div class="markdown-body fade-in">${html}</div>
        `;
        document.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
        addCopyButtons();
        buildToc();
        updateProgress();
        if (typeof renderMathInElement === 'function') {
          renderMathInElement(document.querySelector('.markdown-body'), {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false}
            ],
            throwOnError: false
          });
          // Restore currency $ placeholders after KaTeX (so $500 isn't matched as math)
          const body = document.querySelector('.markdown-body');
          const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, null, false);
          const nodes = [];
          while (walker.nextNode()) nodes.push(walker.currentNode);
          for (const node of nodes) {
            if (node.nodeValue.includes('\uFFFC')) {
              node.nodeValue = node.nodeValue.replace(/\uFFFCCUR(\d+)\uFFFC/g, function(_, idx) {
                return mathPlaceholders[+idx];
              });
            }
          }
        }
        if (scrollToLine) {
          const headingId = getNearestHeadingId(md, scrollToLine);
          if (headingId) {
            setTimeout(() => {
              const el = document.getElementById(headingId);
              if (el) el.scrollIntoView({ behavior: 'smooth' });
            }, 100);
          }
        }
      } catch (err) {
        main.innerHTML = `
          <div class="error fade-in">
            <h2>Could not load &#8220;${file}&#8221;</h2>
            <p>${err.message}</p>
            <p style="margin-top:1rem"><a href="#">&larr; Back to Home</a></p>
          </div>
        `;
      }
    }

    function getNearestHeadingId(md, lineNum) {
      const lines = md.split('\n');
      for (let i = Math.min(lineNum - 1, lines.length - 1); i >= 0; i--) {
        const m = lines[i].match(/^#{2,4}\s+(.+)/);
        if (m) {
          return m[1].toLowerCase()
            .replace(/[^\w\s-]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-')
            .replace(/^-|-$/g, '');
        }
      }
      return null;
    }

    // ── Reference tool functions ──────────────────────────────────────────

    // Normal CDF: Abramowitz & Stegun approximation ( |ε| < 7.5e-8 )
    function normalCDF(z) {
      if (z < 0) return 1 - normalCDF(-z);
      const p = 0.2316419, b1 = 0.319381530, b2 = -0.356563782;
      const b3 = 1.781477937, b4 = -1.821255978, b5 = 1.330274429;
      const t = 1 / (1 + p * z);
      const phi = (1 / Math.sqrt(2 * Math.PI)) * Math.exp(-z * z / 2);
      return 1 - phi * (b1 * t + b2 * t ** 2 + b3 * t ** 3 + b4 * t ** 4 + b5 * t ** 5);
    }
    // Inverse normal CDF — binary search (machine precision in ~50 iters)
    function invNorm(p) {
      if (p <= 0) return -Infinity; if (p >= 1) return Infinity;
      let lo = -8, hi = 8;
      for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; normalCDF(m) < p ? lo = m : hi = m; }
      return (lo + hi) / 2;
    }

      </div>
      <div class="calc-box"><h3>Find Z from P</h3>
        <div class="cr"><label>P(Z ≤ z) =</label><input type="number" id="p2z" step=".01" min=".01" max=".999" value=".975"><span class="res" id="p2zr">z = ${invNorm(.975).toFixed(4)}</span></div>
        <div class="qzs">
          <button onclick="document.getElementById('p2z').value='.5';uP()">50%</button>
          <button onclick="document.getElementById('p2z').value='.84';uP()">84%</button>
          <button onclick="document.getElementById('p2z').value='.9';uP()">90%</button>
          <button onclick="document.getElementById('p2z').value='.95';uP()">95%</button>
          <button onclick="document.getElementById('p2z').value='.975';uP()">97.5%</button>
          <button onclick="document.getElementById('p2z').value='.99';uP()">99%</button>
          <button onclick="document.getElementById('p2z').value='.997';uP()">99.7%</button>
          <button onclick="document.getElementById('p2z').value='.999';uP()">99.9%</button>
        </div>
      </div>
      <div style="margin-bottom:.5rem"><span style="font-size:.88rem;font-weight:600">Full Z-Table</span><span style="font-size:.72rem;color:var(--text-muted);margin-left:.5rem">Hover for detail · Click to set Z</span>
      <div class="cbar" id="cbar"></div><div class="cbl"><span>0%</span><span>50%</span><span>≈100%</span></div></div>
      <div class="ztw"><table class="zt"><thead><tr><th>z</th>${['.00','.01','.02','.03','.04','.05','.06','.07','.08','.09'].map(c=>'<th>'+c+'</th>').join('')}</tr></thead><tbody>
        ${rows.map((cols,ri)=>{
          const zl=(ri/10).toFixed(1);
          return '<tr><td class="zl">'+zl+'</td>'+cols.map(c=>{
            const pct=(c.p*100).toFixed(2);
            return '<td style="background:'+probColor(c.p)+'" data-z="'+c.z.toFixed(2)+'" data-p="'+pct+'">'+pct+'</td>';
          }).join('')+'</tr>';
        }).join('')}
      </tbody></table></div></div>`;

      // Color bar
      const cb = document.getElementById('cbar');
      for (let i = 0; i <= 100; i++) { const s = document.createElement('span'); s.style.background = probColor(i / 100); cb.appendChild(s); }

      // Tooltip
      const tip = document.createElement('div'); tip.className = 'ttip'; tip.id = 'ttip';
      document.body.appendChild(tip);
      document.querySelectorAll('.zt td[data-z]').forEach(td => {
        td.addEventListener('mouseenter', e => {
          const t = document.getElementById('ttip');
          t.innerHTML = '<span class="tz">Z = ' + td.dataset.z + '</span><br>P(Z ≤ z) = <span class="tp">' + td.dataset.p + '%</span>';
          t.classList.add('show');
        });
        td.addEventListener('mousemove', e => { const t = document.getElementById('ttip'); t.style.left = (e.clientX + 12) + 'px'; t.style.top = (e.clientY - 8) + 'px'; });
        td.addEventListener('mouseleave', () => document.getElementById('ttip').classList.remove('show'));
        td.addEventListener('click', () => { document.getElementById('z2p').value = td.dataset.z; uZ(); });
      });

      window.uZ = function () {
        const z = parseFloat(document.getElementById('z2p').value);
        if (isNaN(z)) return;
        const p = z >= 0 ? normalCDF(z) : 1 - normalCDF(-z);
        document.getElementById('z2pr').textContent = 'P(Z ≤ ' + z.toFixed(3) + ') = ' + (p * 100).toFixed(2) + '%';
      };
      window.uP = function () {
        const p = parseFloat(document.getElementById('p2z').value);
        if (isNaN(p) || p <= 0 || p >= 1) return;
        document.getElementById('p2zr').textContent = 'z = ' + invNorm(p).toFixed(4);
      };
      document.getElementById('z2p').addEventListener('input', window.uZ);
      document.getElementById('p2z').addEventListener('input', window.uP);
    }

    function renderInterestFactors(main) {
      const nf = (i, n) => {
        const r = i / 100, o = 1 + r, on = Math.pow(o, n);
        return {
          'P/F': 1 / on, 'F/P': on,
          'P/A': (on - 1) / (r * on), 'A/P': r * on / (on - 1),
          'F/A': (on - 1) / r, 'A/F': r / (on - 1),
          'A/G': 1 / r - n / (on - 1),
          'P/G': ((on - 1) / (r * on) - n / on) / r
        };
      };
      const ff = v => Math.abs(v) >= 1000 ? v.toFixed(4) : Math.abs(v) >= 1 ? v.toFixed(5) : v.toFixed(6);
      const mk = (i, n) => {
        const f = nf(i, n);
        return Object.entries(f).map(([k, v]) =>
          '<div class="fc" onclick="navigator.clipboard.writeText(\'' + v.toFixed(6) + '\');this.classList.add(\'copied\');setTimeout(()=>this.classList.remove(\'copied\'),800)">' +
          '<div class="fn">(' + k + ', ' + i + '%, ' + n + ')</div><div class="fv">' + ff(v) + '</div></div>'
        ).join('');
      };

      main.innerHTML = `
      <div class="doc-bar fade-in"><a href="#" class="back-home">&larr; Home</a><span class="sep">/</span><span class="current">Interest Factor Calculator</span></div>
      <div class="markdown-body fade-in">
      <style>
      .fg{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
      .fc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.6rem .8rem;cursor:pointer;transition:all .1s;user-select:none}
      .fc:hover{border-color:var(--accent);box-shadow:var(--shadow)}
      .fc.copied{background:#2d6a4f;border-color:#2d6a4f}
      .fc.copied .fn,.fc.copied .fv{color:#fff}
      .fn{font-size:.7rem;color:var(--text-muted);font-family:var(--mono);margin-bottom:.1rem}
      .fv{font-size:1rem;font-weight:700;font-family:var(--mono);color:var(--accent)}
      .rs{margin-bottom:1rem}.rs h2{font-size:1.1rem;margin-bottom:0}.rs p{color:var(--text-secondary);font-size:.82rem}
      .cb{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.8rem 1rem;margin-bottom:1rem}
      .cb h3{font-size:.82rem;margin-bottom:.5rem;color:var(--text)}
      .cr{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.2rem}
      .cr label{font-size:.82rem;font-weight:600;color:var(--text-secondary)}
      .cr input{width:80px;padding:.3rem .5rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:.85rem;text-align:center}
      .cr input:focus{outline:none;border-color:var(--accent)}
      .fr{display:grid;grid-template-columns:1fr 1fr;gap:.2rem 1rem;font-size:.76rem;background:var(--surface-hover);border-radius:var(--radius);padding:.5rem .7rem;margin-top:.7rem}
      .fr .fl{font-family:var(--mono);color:var(--text)}.fr .fd{font-size:.65rem;color:var(--text-muted)}
      details summary{font-size:.8rem;font-weight:600;color:var(--text-secondary);cursor:pointer;padding:.3rem 0}
      </style>
      <div class="rs"><h2>Interest Factor Calculator</h2><p>Engineering economy factors (Unit 2). Click any factor to copy its value.</p></div>
      <div class="cb"><h3>Parameters</h3>
        <div class="cr"><label>Interest rate (i):</label><input type="number" id="ir" step=".5" min=".5" max="100" value="10"><span style="font-size:.82rem;color:var(--text-secondary)">%</span>
        <label style="margin-left:.8rem">Periods (n):</label><input type="number" id="ip" step="1" min="1" max="100" value="5"></div>
        <div style="font-size:.75rem;color:var(--text-muted);margin-top:.3rem">Standard discrete compounding · Click any card to copy</div>
      </div>
      <div class="fg" id="fo">${mk(10,5)}</div>
      <details style="margin-top:.8rem"><summary>Formula Reference</summary>
      <div class="fr">
        <div><span class="fl">(P/F, i, n)</span> <span class="fd">= 1/(1+i)ⁿ</span></div>
        <div><span class="fl">(F/P, i, n)</span> <span class="fd">= (1+i)ⁿ</span></div>
        <div><span class="fl">(P/A, i, n)</span> <span class="fd">= ((1+i)ⁿ−1) / (i(1+i)ⁿ)</span></div>
        <div><span class="fl">(A/P, i, n)</span> <span class="fd">= i(1+i)ⁿ / ((1+i)ⁿ−1)</span></div>
        <div><span class="fl">(F/A, i, n)</span> <span class="fd">= ((1+i)ⁿ−1) / i</span></div>
        <div><span class="fl">(A/F, i, n)</span> <span class="fd">= i / ((1+i)ⁿ−1)</span></div>
        <div><span class="fl">(A/G, i, n)</span> <span class="fd">= 1/i − n/((1+i)ⁿ−1)</span></div>
        <div><span class="fl">(P/G, i, n)</span> <span class="fd">= ((1+i)ⁿ−1)/(i(1+i)ⁿ) − n/(1+i)ⁿ</span></div>
      </div></details></div>`;

      const uf = () => {
        const i = parseFloat(document.getElementById('ir').value) || 10;
        const n = parseInt(document.getElementById('ip').value) || 5;
        document.getElementById('fo').innerHTML = mk(i, n);
      };
      document.getElementById('ir').addEventListener('input', uf);
      document.getElementById('ip').addEventListener('input', uf);
    }

    if (!location.hash || location.hash === '#') {
      renderWelcome();
    } else {
      onHashChange();
    }
  </script>
</body>
</html>
