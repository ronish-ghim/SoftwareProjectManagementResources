<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSC415 — Software Project Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-hover: #eef0f2;
      --surface-active: #e2e4e8;
      --text: #1a1a2e;
      --text-secondary: #4a4a5a;
      --text-muted: #8a8a9a;
      --border: #d8dade;
      --accent: #1a1a2e;
      --accent-text: #fff;
      --shadow: 0 1px 4px rgba(0,0,0,0.06);
      --shadow-lg: 0 4px 20px rgba(0,0,0,0.08);
      --radius: 8px;
      --sidebar-w: 260px;
      --topbar-h: 52px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      --toc-w: 200px;
    }
    .dark {
      --bg: #111118;
      --surface: #1a1a24;
      --surface-hover: #252530;
      --surface-active: #2e2e3c;
      --text: #e4e4ed;
      --text-secondary: #9999aa;
      --text-muted: #666677;
      --border: #2a2a36;
      --accent: #6c6cff;
      --accent-text: #fff;
      --shadow: 0 1px 4px rgba(0,0,0,0.3);
      --shadow-lg: 0 4px 20px rgba(0,0,0,0.4);
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      font-size: 15px;
      transition: background 0.2s, color 0.2s;
    }
    ::selection { background: var(--accent); color: var(--accent-text); }

    #progress {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      background: var(--accent);
      z-index: 999;
      width: 0%;
      transition: width 0.05s linear;
    }

    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1rem;
      z-index: 100;
      gap: 0.5rem;
      transition: background 0.2s, border-color 0.2s;
    }
    .topbar button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      padding: 0.3rem 0.5rem;
      border-radius: 6px;
      font-size: 1.1rem;
      transition: background 0.12s;
    }
    .topbar button:hover { background: var(--surface-hover); }
    .topbar .brand {
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .topbar .brand span { color: var(--text-muted); font-weight: 400; }
    .topbar .doc-title {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-left: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 35vw;
    }
    .topbar .divider { width: 1px; height: 20px; background: var(--border); margin: 0 0.3rem; }
    .topbar #themeToggle { font-size: 0.95rem; }

    .sidebar-overlay { display: none; }
    .sidebar {
      position: fixed;
      top: var(--topbar-h); left: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      z-index: 90;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, border-color 0.2s, transform 0.2s ease;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sidebar-search {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-search input {
      width: 100%;
      padding: 0.45rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.78rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .sidebar-search input:focus { border-color: var(--accent); }
    .sidebar-search input::placeholder { color: var(--text-muted); }
    .sidebar-search .search-wrap { position: relative; display: flex; align-items: center; }
    .sidebar-search .search-icon {
      position: absolute; left: 0.6rem; font-size: 0.75rem;
      color: var(--text-muted); pointer-events: none; line-height: 1;
    }
    .sidebar-search input { padding-left: 1.8rem; padding-right: 1.8rem; }
    .sidebar-search .search-clear {
      position: absolute; right: 0.3rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 1.05rem; padding: 0.1rem 0.35rem;
      display: none; line-height: 1; border-radius: 3px;
      transition: color 0.1s, background 0.1s;
    }
    .sidebar-search .search-clear:hover { background: var(--surface-hover); color: var(--text); }
    .sidebar-search .search-clear.visible { display: flex; align-items: center; justify-content: center; }

    .search-results { display: none; }
    .search-results.open { display: block; }
    .search-results .result-header {
      padding: 0.6rem 0.8rem 0.4rem;
      font-size: 0.65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .search-results .result-item {
      display: block;
      padding: 0.5rem 0.8rem;
      text-decoration: none;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.1s;
    }
    .search-results .result-item:hover { background: var(--surface-hover); }
    .search-results .result-item .result-title {
      font-size: 0.78rem; font-weight: 600; color: var(--text);
      display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.25rem;
    }
    .search-results .result-item .result-title .badge {
      flex-shrink: 0;
      width: 1.2rem; height: 1.2rem;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 3px; font-weight: 700; font-size: 0.55rem;
      background: var(--accent); color: var(--accent-text);
    }
    .search-results .result-item .result-title .badge.supp { background: #2d6a4f; color: #fff; }
    .search-results .result-item .snippet {
      font-size: 0.7rem; color: var(--text-secondary);
      line-height: 1.5; font-family: var(--mono);
      white-space: pre-wrap; word-break: break-word;
      background: var(--bg); padding: 0.3rem 0.5rem;
      border-radius: 4px; margin-left: 1.6rem;
      overflow-x: auto;
    }
    .search-results .result-item .snippet mark {
      background: #fde68a; color: #1a1a2e;
      padding: 0 0.12rem; border-radius: 2px;
    }
    .dark .search-results .result-item .snippet mark {
      background: #a37d1c; color: #fff;
    }
    .search-results .result-item .result-meta {
      font-size: 0.65rem; color: var(--text-muted);
      margin-top: 0.1rem; margin-left: 1.6rem;
    }
    .search-results .no-results, .search-results .search-loading {
      padding: 1.5rem 0.8rem; text-align: center;
      color: var(--text-muted); font-size: 0.78rem;
    }
    .search-results .search-loading .ring {
      width: 20px !important; height: 20px !important;
      border-width: 2px !important;
      margin: 0 auto 0.5rem;
    }
    .sidebar-scroll > .sidebar-group.hidden,
    .sidebar-scroll > [id^="group-"].hidden,
    .sidebar-scroll > .no-match.hidden { display: none; }

    .sidebar-scroll { flex: 1; overflow-y: auto; padding-bottom: 1rem; }
    .sidebar-group {
      padding: 0.7rem 1rem 0.3rem;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .sidebar a {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 1rem;
      text-decoration: none;
      color: var(--text);
      font-size: 0.8rem;
      border-left: 3px solid transparent;
      transition: background 0.1s;
    }
    .sidebar a:hover { background: var(--surface-hover); }
    .sidebar a.active {
      background: var(--surface-active);
      border-left-color: var(--accent);
      font-weight: 600;
    }
    .sidebar a.hidden { display: none; }
    .sidebar a .badge {
      flex-shrink: 0;
      width: 1.4rem;
      height: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.6rem;
      background: var(--accent);
      color: var(--accent-text);
      transition: background 0.2s, color 0.2s;
    }
    .sidebar a .badge.supp { background: #2d6a4f; color: #fff; }
    .sidebar .no-match {
      padding: 1rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      display: none;
    }

    .toc-toggle {
      position: fixed;
      right: 0.8rem; bottom: 1.2rem;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.95rem;
      cursor: pointer;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-lg);
      transition: background 0.12s, transform 0.15s;
    }
    .toc-toggle:hover { background: var(--surface-hover); transform: scale(1.05); }
    .toc-toggle.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

    .toc-panel {
      position: fixed;
      right: 0.8rem; bottom: 4rem;
      width: 220px;
      max-height: 60vh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      z-index: 79;
      padding: 0.5rem 0;
      overflow-y: auto;
      display: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .toc-panel.open { display: block; }
    .toc-panel::-webkit-scrollbar { width: 3px; }
    .toc-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .toc-panel .toc-title {
      padding: 0.4rem 0.8rem 0.3rem;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 700;
    }
    .toc-panel a {
      display: block;
      padding: 0.3rem 0.8rem;
      font-size: 0.76rem;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.1s;
      line-height: 1.4;
      border-left: 2px solid transparent;
    }
    .toc-panel a:hover { color: var(--text); background: var(--surface-hover); }
    .toc-panel a.h2 { padding-left: 0.8rem; }
    .toc-panel a.h3 { padding-left: 1.6rem; font-size: 0.72rem; }
    .toc-panel a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

    .main {
      margin: var(--topbar-h) 0 0 var(--sidebar-w);
      min-height: calc(100vh - var(--topbar-h));
      padding: 2rem 3rem;
      max-width: 900px;
      transition: margin 0.2s, padding 0.2s;
    }
    @media (max-width: 1200px) { .main { padding: 1.8rem 2rem; } }

    .welcome { max-width: 680px; margin: 1.5rem auto; }
    .welcome h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.2rem;
      line-height: 1.2;
    }
    .welcome .sub {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }
    .welcome .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-bottom: 2rem;
    }
    .welcome .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.15s;
    }
    .welcome .card h3 {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }
    .welcome .card p { font-size: 0.88rem; color: var(--text); }
    .welcome .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin: 1.2rem 0 0.5rem;
    }
    .welcome .unit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .welcome .unit-grid a {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.8rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 500;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.2s;
    }
    .welcome .unit-grid a:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }
    .welcome .unit-grid a .num {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.4rem;
      height: 1.4rem;
      border-radius: 4px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 0.6rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .welcome .unit-grid a .num.supp { background: #2d6a4f; color: #fff; }
    .welcome .unit-grid a .arrow { margin-left: auto; color: var(--text-muted); font-size: 0.75rem; }
    @media (max-width: 600px) {
      .welcome .grid { grid-template-columns: 1fr; }
      .welcome .unit-grid { grid-template-columns: 1fr; }
    }

    .markdown-body {
      background: transparent;
      font-size: 0.95rem;
      color: var(--text);
      transition: color 0.2s;
    }
    .markdown-body h1, .markdown-body h2 { border-bottom-color: var(--border); }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      color: var(--text);
      scroll-margin-top: calc(var(--topbar-h) + 0.5rem);
    }
    .markdown-body a { color: var(--accent); }
    .markdown-body strong { color: var(--accent); font-weight: 700; }
    .markdown-body em { color: var(--text-secondary); font-style: italic; }
    .markdown-body strong em, .markdown-body em strong { color: var(--accent); font-style: italic; font-weight: 700; }
    .markdown-body pre {
      background: var(--bg) !important;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      position: relative;
      transition: background 0.2s, border-color 0.2s;
      line-height: 1.2;
      white-space: pre;
      overflow-x: auto;
    }
    .markdown-body code {
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.82em;
    }
    .markdown-body pre code { font-size: 0.8rem; }
    .markdown-body blockquote {
      color: var(--text-secondary);
      border-left-color: var(--border);
    }
    .markdown-body p > code, .markdown-body li > code {
      background: var(--surface-hover);
      padding: 0.1em 0.3em;
      border-radius: 3px;
      font-size: 0.85em;
    }
    .markdown-body table td, .markdown-body table th { border-color: var(--border); }
    .markdown-body table tr { background: transparent; }
    .markdown-body table tr:nth-child(2n) { background: var(--bg); }
    .markdown-body img { border-radius: var(--radius); max-width: 100%; }
    .markdown-body .math, .markdown-body .katex-display { overflow-x: auto; overflow-y: hidden; }
    .markdown-body .katex { font-size: 1.05em; }
    .markdown-body p { margin-bottom: 1em; }
    .markdown-body hr { background: var(--border); }
    .markdown-body pre {
      padding-top: 2.2rem !important;
    }
    .copy-btn {
      position: absolute;
      top: 0.4rem;
      right: 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      font-size: 0.68rem;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font);
      opacity: 0;
      transition: opacity 0.15s, background 0.12s;
    }
    .markdown-body pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--surface-hover); color: var(--text); }
    .copy-btn.copied { background: #2d6a4f; color: #fff; border-color: #2d6a4f; }

    .doc-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      transition: border-color 0.2s;
    }
    .doc-bar .sep { color: var(--text-muted); }
    .doc-bar .current { font-weight: 600; color: var(--text); }
    .doc-bar .back-home {
      color: var(--text-secondary);
      text-decoration: none;
      margin-left: auto;
      font-size: 0.78rem;
    }
    .doc-bar .back-home:hover { text-decoration: underline; }

    .spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 0;
      gap: 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .spinner .ring {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      text-align: center;
      padding: 4rem 2rem;
      color: #b91c1c;
    }
    .error h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    .error a { color: var(--accent); }

    .fade-in {
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 820px) {
      .sidebar {
        transform: translateX(-100%);
        top: 0;
        padding-top: var(--topbar-h);
        box-shadow: var(--shadow-lg);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.3);
        z-index: 89;
      }
      .sidebar-overlay.show { display: block; }
      .main { margin-left: 0; padding: 1.2rem 1rem; }
      .topbar .doc-title { max-width: 25vw; }
      .toc-panel { right: 0.5rem; width: 200px; }
      .copy-btn { opacity: 1 !important; }
    }
  </style>
</head>
<body>

  <div id="progress"></div>

  <div class="sidebar-overlay" id="overlay"></div>

  <header class="topbar">
    <button id="menuBtn" onclick="toggleSidebar()" aria-label="Toggle sidebar">&#9776;</button>
    <div class="brand">CSC415 <span>SPM</span></div>
    <div class="divider"></div>
    <span class="doc-title" id="docTitle"></span>
    <div class="divider"></div>
    <button id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">&#9681;</button>
  </header>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-search">
      <div class="search-wrap">
        <span class="search-icon">&#x1F50D;</span>
        <input type="text" id="searchInput" placeholder="Search notes&hellip;" oninput="onSearchInput(this.value)" spellcheck="false">
        <button class="search-clear" id="searchClear" onclick="clearSearch()" aria-label="Clear search">&times;</button>
      </div>
    </div>
    <div class="sidebar-scroll">
      <div class="sidebar-group">Project Foundation</div>
      <div id="group-1"></div>
      <div class="sidebar-group">Planning &amp; Scheduling</div>
      <div id="group-2"></div>
      <div class="sidebar-group">Execution &amp; Control</div>
      <div id="group-3"></div>
      <div class="sidebar-group">Quality &amp; Configuration</div>
      <div id="group-4"></div>
      <div class="sidebar-group" style="margin-top:0.5rem">Reference</div>
      <div id="group-supp"></div>
      <div class="no-match" id="noMatch">No notes match your filter.</div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </nav>

  <button class="toc-toggle" id="tocToggle" onclick="toggleToc()" aria-label="Table of Contents">&#9776;</button>
  <div class="toc-panel" id="tocPanel">
    <div class="toc-title">On this page</div>
    <div id="tocLinks"></div>
  </div>

  <main class="main" id="main"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script>
    const notes = [
      { file: 'unit_01_introduction_to_software_project_management.md', label: 'Introduction to SPM',                 num: '01', g: 1 },
      { file: 'unit_02_project_analysis.md',                           label: 'Project Analysis',                     num: '02', g: 1 },
      { file: 'unit_03_activity_planning_and_scheduling.md',           label: 'Activity Planning & Scheduling',      num: '03', g: 2 },
      { file: 'unit_04_risk_management.md',                            label: 'Risk Management',                     num: '04', g: 2 },
      { file: 'unit_05_resource_allocation.md',                        label: 'Resource Allocation',                 num: '05', g: 2 },
      { file: 'unit_06_monitoring_and_control.md',                     label: 'Monitoring & Control',                num: '06', g: 3 },
      { file: 'unit_07_managing_contracts_and_people.md',              label: 'Managing Contracts & People',         num: '07', g: 3 },
      { file: 'unit_08_software_quality_assurance_and_testing.md',     label: 'SQA & Testing',                       num: '08', g: 4 },
      { file: 'unit_09_software_configuration_management.md',          label: 'Software Configuration Management',   num: '09', g: 4 },
    ];
    const supplements = [
      { file: 'syllabus.md',    label: 'Syllabus',     g: 'supp' },
      { file: 'cheatsheet.md',  label: 'Cheatsheet',   g: 'supp' },
      { file: 'study_guide.md', label: 'Study Guide',  g: 'supp' },
    ];
    const allFiles = [...notes, ...supplements];
    const basePath = 'notes/';

    function buildSidebar() {
      const groups = { 1: 'group-1', 2: 'group-2', 3: 'group-3', 4: 'group-4', supp: 'group-supp' };
      [notes, supplements].forEach(arr => {
        arr.forEach(n => {
          const a = document.createElement('a');
          a.href = '#' + n.file;
          a.innerHTML = n.g === 'supp'
            ? `<span class="badge supp">${n.label[0]}</span> ${n.label}`
            : `<span class="badge">${n.num}</span> ${n.label}`;
          a.dataset.file = n.file;
          a.dataset.group = n.g;
          document.getElementById(groups[n.g]).appendChild(a);
        });
      });
    }
    buildSidebar();

    const contentCache = {};

    async function fetchContent(file) {
      if (contentCache[file]) return contentCache[file];
      try {
        const isSupp = supplements.some(s => s.file === file);
        const path = isSupp ? file : basePath + file;
        const res = await fetch(path);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        contentCache[file] = text;
        return text;
      } catch {
        return null;
      }
    }

    function debounce(fn, ms) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), ms);
      };
    }

    function highlightMatch(text, query) {
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
    }

    function showSearchResults() {
      document.querySelectorAll('.sidebar-scroll > .sidebar-group, .sidebar-scroll > [id^="group-"], .sidebar-scroll > .no-match')
        .forEach(el => el.classList.add('hidden'));
      document.getElementById('searchResults').classList.add('open');
    }

    function hideSearchResults() {
      document.querySelectorAll('.sidebar-scroll > .sidebar-group, .sidebar-scroll > [id^="group-"], .sidebar-scroll > .no-match')
        .forEach(el => el.classList.remove('hidden'));
      document.getElementById('searchResults').classList.remove('open');
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('searchClear').classList.remove('visible');
      hideSearchResults();
    }

    function onSearchInput(val) {
      const v = val.trim();
      const clearBtn = document.getElementById('searchClear');
      if (!v || v.length < 2) {
        clearBtn.classList.remove('visible');
        hideSearchResults();
        return;
      }
      clearBtn.classList.add('visible');
      debouncedSearch(v);
    }

    async function searchContent(query) {
      const q = query.toLowerCase().trim();
      if (!q || q.length < 2) return;

      const resultsContainer = document.getElementById('searchResults');
      showSearchResults();
      resultsContainer.innerHTML = '<div class="search-loading"><div class="ring"></div><span>Searching notes...</span></div>';

      const results = [];

      for (const note of allFiles) {
        const content = await fetchContent(note.file);
        if (!content) continue;

        const lines = content.split('\n');
        const lower = content.toLowerCase();
        let pos = lower.indexOf(q);
        let matchCount = 0;

        while (pos !== -1 && matchCount < 3) {
          const lineBefore = content.substring(0, pos);
          const lineNum = lineBefore.split('\n').length;
          const lineIdx = lineNum - 1;
          const matchedLine = lines[lineIdx] || '';

          const startLine = Math.max(0, lineIdx - 1);
          const endLine = Math.min(lines.length, lineIdx + 2);
          let snippet = lines.slice(startLine, endLine).join('\n');
          snippet = highlightMatch(snippet, query);

          results.push({ note, lineNum, snippet });

          matchCount++;
          pos = lower.indexOf(q, pos + 1);
        }

        if (pos !== -1) {
          let extraCount = 0;
          while (pos !== -1) { extraCount++; pos = lower.indexOf(q, pos + 1); }
          if (extraCount > 0) {
            const last = results[results.length - 1];
            if (last && last.note.file === note.file) {
              last.extra = extraCount;
            }
          }
        }
      }

      renderSearchResults(query, results);
    }

    function renderSearchResults(query, results) {
      const container = document.getElementById('searchResults');
      if (!results.length) {
        container.innerHTML = `<div class="no-results">No results found for &ldquo;${query}&rdquo;</div>`;
        return;
      }

      const total = results.reduce((sum, r) => sum + 1 + (r.extra || 0), 0);
      let html = `<div class="result-header">${total} result${total !== 1 ? 's' : ''} for &ldquo;${query}&rdquo;</div>`;

      results.forEach(r => {
        const isSupp = r.note.g === 'supp';
        const badge = isSupp ? r.note.label[0] : r.note.num;
        const badgeClass = isSupp ? 'badge supp' : 'badge';
        const extra = r.extra ? `<div class="result-meta">+${r.extra} more match${r.extra > 1 ? 'es' : ''}</div>` : '';

        html += `
          <a class="result-item" href="#${r.note.file}|${r.lineNum}" onclick="clearSearch()">
            <div class="result-title"><span class="${badgeClass}">${badge}</span> ${r.note.label}</div>
            <div class="snippet">${r.snippet}</div>
            ${extra}
          </a>
        `;
      });

      container.innerHTML = html;
    }

    const debouncedSearch = debounce((val) => { searchContent(val); }, 300);

    function getTheme() { return localStorage.getItem('spm-theme') || 'light'; }
    function setTheme(t) {
      document.documentElement.classList.toggle('dark', t === 'dark');
      localStorage.setItem('spm-theme', t);
      document.getElementById('themeToggle').textContent = t === 'dark' ? '\u2600' : '\u263E';
    }
    function toggleTheme() { setTheme(getTheme() === 'dark' ? 'light' : 'dark'); }
    setTheme(getTheme());

    marked.setOptions({
      breaks: true,
      gfm: true,
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try { return hljs.highlight(code, { language: lang }).value; } catch {}
        }
        return code;
      }
    });

    function addCopyButtons() {
      document.querySelectorAll('.markdown-body pre').forEach(pre => {
        if (pre.querySelector('.copy-btn')) return;
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.addEventListener('click', async () => {
          const code = pre.querySelector('code')?.textContent || pre.textContent;
          try {
            await navigator.clipboard.writeText(code);
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
          } catch { btn.textContent = 'Failed'; }
        });
        pre.style.position = 'relative';
        pre.appendChild(btn);
      });
    }

    function buildToc() {
      const container = document.getElementById('tocLinks');
      container.innerHTML = '';
      const headings = document.querySelectorAll('.markdown-body h2, .markdown-body h3');
      if (!headings.length) { container.innerHTML = '<div style="padding:0.5rem 0.8rem;font-size:0.75rem;color:var(--text-muted)">No headings</div>'; return; }
      headings.forEach(h => {
        if (!h.id) h.id = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        a.className = h.tagName === 'H3' ? 'h3' : 'h2';
        container.appendChild(a);
      });
    }

    function updateTocActive() {
      const links = document.querySelectorAll('#tocLinks a');
      let current = '';
      links.forEach(a => a.classList.remove('active'));
      const scrollY = window.scrollY + 80;
      document.querySelectorAll('.markdown-body h2, .markdown-body h3').forEach(h => {
        if (h.offsetTop <= scrollY) current = h.id;
      });
      links.forEach(a => {
        if (a.getAttribute('href') === '#' + current) a.classList.add('active');
      });
    }

    function toggleToc() {
      document.getElementById('tocPanel').classList.toggle('open');
      document.getElementById('tocToggle').classList.toggle('active');
    }

    function updateProgress() {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const pct = docHeight > 0 ? Math.min(scrollTop / docHeight * 100, 100) : 0;
      document.getElementById('progress').style.width = pct + '%';
    }

    function renderWelcome() {
      const m = document.getElementById('main');
      document.getElementById('docTitle').textContent = '';
      closeToc();

      const groups = [
        { label: 'Project Foundation', notes: notes.filter(n => n.g === 1) },
        { label: 'Planning &amp; Scheduling', notes: notes.filter(n => n.g === 2) },
        { label: 'Execution &amp; Control', notes: notes.filter(n => n.g === 3) },
        { label: 'Quality &amp; Configuration', notes: notes.filter(n => n.g === 4) },
      ];

      m.innerHTML = `
        <div class="welcome fade-in">
          <h1>Software Project Management</h1>
          <div class="sub">CSC415 &middot; BSc CSIT &middot; Semester VII &middot; Tribhuvan University</div>
          <div class="grid">
            <div class="card"><h3>Course</h3><p>CSC415 — 3 Credit Hours (Theory)</p></div>
            <div class="card"><h3>Evaluation</h3><p>60 (final) + 40 (internal) = 100</p></div>
            <div class="card"><h3>Units</h3><p>9 units covering SPM lifecycle from analysis to configuration</p></div>
            <div class="card"><h3>Source</h3><p>Class notes &middot; 9 compiled markdown files</p></div>
          </div>
          ${groups.map(g => `
            <div class="section-label">${g.label}</div>
            <div class="unit-grid">
              ${g.notes.map(n => `
                <a href="#${n.file}"><span class="num">${n.num}</span> ${n.label} <span class="arrow">&rarr;</span></a>
              `).join('')}
            </div>
          `).join('')}
          <div class="section-label" style="margin-top:1.5rem">Reference</div>
          <div class="unit-grid">
            ${supplements.map(n => `
              <a href="#${n.file}"><span class="num supp">${n.label[0]}</span> ${n.label} <span class="arrow">&rarr;</span></a>
            `).join('')}
          </div>
        </div>
      `;
    }

    async function loadFile(file, scrollToLine) {
      const main = document.getElementById('main');
      const entry = allFiles.find(f => f.file === file);
      const label = entry?.label || file;
      document.getElementById('docTitle').textContent = label;
      closeToc();

      document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
      const activeLink = document.querySelector(`.sidebar a[data-file="${file}"]`);
      if (activeLink) activeLink.classList.add('active');
      if (window.innerWidth <= 820) closeSidebar();

      main.innerHTML = '<div class="spinner"><div class="ring"></div><span>Loading&hellip;</span></div>';
      document.querySelectorAll('#tocLinks a').forEach(a => a.classList.remove('active'));

      try {
        const md = await fetchContent(file);
        if (!md) throw new Error('Not found');
        const html = marked.parse(md).replace(/src="assets\//g, 'src="notes/assets/');
        main.innerHTML = `
          <div class="doc-bar fade-in">
            <a href="#" class="back-home">&larr; Home</a>
            <span class="sep">/</span>
            <span class="current">${label}</span>
          </div>
          <div class="markdown-body fade-in">${html}</div>
        `;
        document.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
        addCopyButtons();
        buildToc();
        updateProgress();
        if (typeof renderMathInElement === 'function') {
          renderMathInElement(document.querySelector('.markdown-body'), {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false}
            ],
            throwOnError: false
          });
        }
        if (scrollToLine) {
          const headingId = getNearestHeadingId(md, scrollToLine);
          if (headingId) {
            setTimeout(() => {
              const el = document.getElementById(headingId);
              if (el) el.scrollIntoView({ behavior: 'smooth' });
            }, 100);
          }
        }
      } catch (err) {
        main.innerHTML = `
          <div class="error fade-in">
            <h2>Could not load &#8220;${file}&#8221;</h2>
            <p>${err.message}</p>
            <p style="margin-top:1rem"><a href="#">&larr; Back to Home</a></p>
          </div>
        `;
      }
    }

    function closeToc() {
      document.getElementById('tocPanel').classList.remove('open');
      document.getElementById('tocToggle').classList.remove('active');
    }

    function getNearestHeadingId(md, lineNum) {
      const lines = md.split('\n');
      for (let i = Math.min(lineNum - 1, lines.length - 1); i >= 0; i--) {
        const m = lines[i].match(/^#{2,4}\s+(.+)/);
        if (m) {
          return m[1].toLowerCase()
            .replace(/[^\w\s-]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-')
            .replace(/^-|-$/g, '');
        }
      }
      return null;
    }

    function onHashChange() {
      clearSearch();
      const raw = location.hash.replace('#', '');
      if (!raw || raw === '/') { renderWelcome(); return; }
      const [file, lineNum] = raw.split('|');
      if (allFiles.some(f => f.file === file)) {
        loadFile(file, lineNum ? parseInt(lineNum) : null);
        return;
      }
      if (document.getElementById(raw)) {
        document.getElementById(raw).scrollIntoView({ behavior: 'smooth' });
        return;
      }
      renderWelcome();
    }
    window.addEventListener('hashchange', onHashChange);

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('show');
      document.body.style.overflow = document.getElementById('sidebar').classList.contains('open') ? 'hidden' : '';
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
      document.body.style.overflow = '';
    }
    document.getElementById('overlay').addEventListener('click', closeSidebar);
    document.querySelector('.sidebar-scroll').addEventListener('click', e => {
      const link = e.target.closest('a');
      if (link && window.innerWidth <= 820) closeSidebar();
    });

    let tocScrollTimeout;
    window.addEventListener('scroll', () => {
      updateProgress();
      if (document.getElementById('tocPanel').classList.contains('open')) {
        clearTimeout(tocScrollTimeout);
        tocScrollTimeout = setTimeout(updateTocActive, 80);
      }
    });

    document.addEventListener('click', e => {
      const panel = document.getElementById('tocPanel');
      const btn = document.getElementById('tocToggle');
      if (panel.classList.contains('open') && !panel.contains(e.target) && !btn.contains(e.target)) {
        closeToc();
      }
    });

    document.getElementById('main').addEventListener('click', e => {
      const link = e.target.closest('a');
      if (link && link.getAttribute('href')?.endsWith('.md')) {
        e.preventDefault();
        const href = link.getAttribute('href');
        const file = href.includes('/') ? href.split('/').pop() : href;
        if (allFiles.some(f => f.file === file)) {
          location.hash = '#' + file;
        } else {
          window.open(href, '_blank');
        }
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      if (e.key === 'Escape' && document.activeElement === document.getElementById('searchInput')) {
        clearSearch();
        document.activeElement.blur();
      }
    });

    if (!location.hash || location.hash === '#') {
      renderWelcome();
    } else {
      onHashChange();
    }
  </script>
</body>
</html>
